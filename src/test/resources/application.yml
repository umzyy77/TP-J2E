spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

jwt:
  secret: TestSecretKeyForJWTSigningMustBeAtLeast256BitsLongForTests!!
  expiration: 3600000

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

info:
  app:
    name: MasterAnnonce
    description: API REST MasterAnnonce (test)
    version: test
