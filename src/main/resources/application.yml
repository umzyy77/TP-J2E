spring:
  application:
    name: MasterAnnonce

  datasource:
    url: jdbc:postgresql://localhost:5432/MasterAnnonce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

jwt:
  secret: MasterAnnonceSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!
  expiration: 86400000
