spring:
  application:
    name: MasterAnnonce

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/MasterAnnonce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui

jwt:
  secret: MasterAnnonceSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!
  expiration: 86400000
  refresh-secret: MasterAnnonceRefreshSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!
  refresh-expiration: 604800000

rate-limit:
  login:
    enabled: true
    path: /api/auth/login
    max-requests: 20
    window-seconds: 60

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: API REST MasterAnnonce
    version: 1.0.0
