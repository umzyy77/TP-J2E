/**
 * Configuration JAAS pour MasterAnnonce.
 *
 * Deux domaines :
 * - MasterAnnonceLogin : authentification username/password (DbLoginModule)
 * - MasterAnnonceToken : authentification par token Bearer (TokenLoginModule)
 */

MasterAnnonceLogin {
    org.example.tpj2eannonces.api.security.jaas.DbLoginModule required;
};

MasterAnnonceToken {
    org.example.tpj2eannonces.api.security.jaas.TokenLoginModule required;
};
