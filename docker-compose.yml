services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masterannonce_app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-MasterAnnonce}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JWT_SECRET: ${JWT_SECRET:-MasterAnnonceSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-MasterAnnonceRefreshSecretKeyForJWTSigningMustBeAtLeast256BitsLong!!}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      RATE_LIMIT_LOGIN_ENABLED: ${RATE_LIMIT_LOGIN_ENABLED:-true}
      RATE_LIMIT_LOGIN_PATH: ${RATE_LIMIT_LOGIN_PATH:-/api/auth/login}
      RATE_LIMIT_LOGIN_MAX_REQUESTS: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:-20}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      INFO_APP_NAME: ${INFO_APP_NAME:-MasterAnnonce}
      INFO_APP_DESCRIPTION: ${INFO_APP_DESCRIPTION:-API REST MasterAnnonce}
      INFO_APP_VERSION: ${INFO_APP_VERSION:-1.0.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: masterannonce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-MasterAnnonce}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-password123}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-MasterAnnonce}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  postgres_data:
    name: masterannonce_postgres_data
